#==============================================================================
# HOW TO USE THIS FILE
#==============================================================================
# 
# 1. Copy this template:
#    cp use-cases/templates-chart/values-custom.yaml values-myorg.yaml
#
# 2. Uncomment and modify the example that matches your needs
#
# 3. Deploy with custom values:
#    helm upgrade kyverno ./use-cases/templates-chart -f values-myorg.yaml
#
# 4. Verify policies are applied:
#    kubectl get clusterpolicy
#    helm get values kyverno
#
# 5. Test with sample workloads:
#    kubectl run test-pod --image=nginx -n test-namespace
#
#==============================================================================
