# Kyverno Helm Values - Custom Template
# Copy this file and modify for your organization
# Example: cp values-custom.yaml values-prod.yaml
# Then deploy: helm upgrade kyverno ./templates-chart -f values-prod.yaml

# Copy and uncomment the sections you want to customize
# Lines with # are comments and will be ignored

#==============================================================================
# EXAMPLE 1: DEVELOPMENT ENVIRONMENT CUSTOMIZATION
#==============================================================================
