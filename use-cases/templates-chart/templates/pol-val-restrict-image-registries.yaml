apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: restrict-image-registries
  namespace: default
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      This policy restricts container images to only those from approved registries.
      Approved registries: docker.io, gcr.io, quay.io
spec:
  validationFailureAction: audit
  rules:
  - name: validate-registries
    match:
      resources:
        kinds:
        - Pod
    validate:
      message: "Images must come from approved registries: docker.io, gcr.io, quay.io"
      pattern:
        spec:
          containers:
          - image: "docker.io/* | gcr.io/* | quay.io/*"
