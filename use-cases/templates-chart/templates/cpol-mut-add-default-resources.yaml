{{- if and .Values.policies.mutate.enabled .Values.policies.mutate.addDefaultResources.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-resources
  annotations:
    policies.kyverno.io/title: Add Default Resource Requests and Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Automatically adds default CPU and memory requests/limits to containers.
      Customize resource values and namespace-specific defaults via values.yaml
    customizable: "true"
    values-path: "policies.mutate.addDefaultResources"
spec:
  background: {{ .Values.global.background | default true }}
  rules:
  - name: add-default-resources
    match:
      resources:
        kinds:
        - Pod
        {{- if .Values.policies.mutate.addDefaultResources.namespaceSelector }}
        namespaceSelector:
          matchLabels:
            {{- range $key, $value := .Values.policies.mutate.addDefaultResources.namespaceSelector.matchLabels }}
            {{ $key }}: "{{ $value }}"
            {{- end }}
        {{- end }}
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - (name): "*"
            resources:
              requests:
                cpu: "{{ .Values.policies.mutate.addDefaultResources.resources.requests.cpu }}"
                memory: "{{ .Values.policies.mutate.addDefaultResources.resources.requests.memory }}"
              limits:
                cpu: "{{ .Values.policies.mutate.addDefaultResources.resources.limits.cpu }}"
                memory: "{{ .Values.policies.mutate.addDefaultResources.resources.limits.memory }}"
{{- end }}
