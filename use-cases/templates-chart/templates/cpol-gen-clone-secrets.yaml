{{- if and .Values.policies.generate.enabled .Values.policies.generate.cloneRegistrySecrets.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: clone-registry-secrets
  annotations:
    policies.kyverno.io/title: Clone Registry Secrets to New Namespaces
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Automatically clone docker registry credentials from default namespace
      to all new namespaces. This ensures pods can pull from private registries.
      Customizable via values.yaml - modify resource kinds, namespace selector, and secret names.
    customizable: "true"
    values-path: "policies.generate.cloneRegistrySecrets"
spec:
  rules:
  - name: clone-docker-secret
    match:
      resources:
        kinds:
          {{- range .Values.policies.generate.cloneRegistrySecrets.resourceKinds }}
          - {{ . }}
          {{- end }}
        {{- if .Values.policies.generate.cloneRegistrySecrets.namespaceSelector.matchLabels }}
        selector:
          matchLabels:
            {{- range $key, $value := .Values.policies.generate.cloneRegistrySecrets.namespaceSelector.matchLabels }}
            {{ $key }}: "{{ $value }}"
            {{- end }}
        {{- end }}
    generate:
      apiVersion: v1
      kind: Secret
      name: {{ .Values.policies.generate.cloneRegistrySecrets.targetSecretName }}
      namespace: "{{ "{{ request.object.metadata.name }}" }}"
      clone:
        namespace: {{ .Values.policies.generate.cloneRegistrySecrets.sourceNamespace }}
        name: {{ .Values.policies.generate.cloneRegistrySecrets.secretName }}
      # The source secret must exist in the configured source namespace.
      # Secret will be cloned automatically when namespace is created
{{- end }}
