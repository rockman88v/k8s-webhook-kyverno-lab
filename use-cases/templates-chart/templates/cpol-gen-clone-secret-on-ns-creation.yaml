{{- if and .Values.policies.generate.enabled .Values.policies.generate.cloneSecretOnNamespaceCreation.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: clone-secret-on-namespace-creation
  annotations:
    policies.kyverno.io/title: Clone Secret on Namespace Creation
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      This policy generates a secret in new namespaces by cloning from a source secret.
      Customizable via values.yaml - modify resource kinds, namespace selector, and secret names.
    customizable: "true"
    values-path: "policies.generate.cloneSecretOnNamespaceCreation"
spec:
  rules:
  - name: clone-secret
    match:
      resources:
        kinds:
          {{- range .Values.policies.generate.cloneSecretOnNamespaceCreation.resourceKinds }}
          - {{ . }}
          {{- end }}
      {{- if .Values.policies.generate.cloneSecretOnNamespaceCreation.namespaceSelector.matchLabels }}
        selector:
          matchLabels:
            {{- range $key, $value := .Values.policies.generate.cloneSecretOnNamespaceCreation.namespaceSelector.matchLabels }}
            {{ $key }}: "{{ $value }}"
            {{- end }}
      {{- end }}
    generate:
      kind: Secret
      name: {{ .Values.policies.generate.cloneSecretOnNamespaceCreation.targetSecretName }}
      namespace: "{{ "{{ request.object.metadata.name }}" }}"
      clone:
        namespace: {{ .Values.policies.generate.cloneSecretOnNamespaceCreation.sourceNamespace }}
        name: {{ .Values.policies.generate.cloneSecretOnNamespaceCreation.sourceSecretName }}
{{- end }}
